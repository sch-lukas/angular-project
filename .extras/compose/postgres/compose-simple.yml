# Vereinfachtes PostgreSQL compose für Windows
# Verwendet Docker-Volumes statt Bind-Mounts

services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: p
      POSTGRES_DB: buch
      TZ: Europe/Berlin
      PGTZ: Europe/Berlin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [acme-network]
    hostname: postgres
    container_name: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 2s
      start_period: 5s
    restart: unless-stopped

networks:
  acme-network:
    name: acme-network

volumes:
  postgres_data:
