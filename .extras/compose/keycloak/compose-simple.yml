# Vereinfachtes Keycloak compose für Windows
# Import-Ordner wird separat gemountet um Volume-Konflikt zu vermeiden

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.5-0
    ports:
      - "8880:8080"
      - "8843:8443"
      - "9990:9000"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /opt/keycloak/data/import
        cp /opt/keycloak/import/*.json /opt/keycloak/data/import/ 2>/dev/null || true
        /opt/keycloak/bin/kc.sh start-dev --import-realm
    volumes:
      - keycloak_data:/opt/keycloak/data
      - type: bind
        source: ./export
        target: /opt/keycloak/import
        read_only: true
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      TZ: Europe/Berlin
    networks: [acme-network]
    hostname: keycloak
    container_name: keycloak
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000;echo -e 'GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then exit 0; else exit 1; fi",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

networks:
  acme-network:
    external: true

volumes:
  keycloak_data:
