<svg viewBox="0 0 60 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Stilisiertes Buch mit geöffneten Seiten -->
  <g id="book-icon">
    <!-- Linke Seite des Buchs -->
    <path d="M 4 16 Q 4 12, 8 12 L 20 12 Q 24 12, 24 16 L 24 48 Q 24 52, 20 52 L 8 52 Q 4 52, 4 48 Z"
          fill="#1d4ed8" opacity="0.9"/>

    <!-- Rechte Seite des Buchs (leicht geöffnet) -->
    <path d="M 24 16 Q 24 12, 28 12 L 40 12 Q 44 12, 44 16 L 44 48 Q 44 52, 40 52 L 28 52 Q 24 52, 24 48 Z"
          fill="#3b82f6"/>

    <!-- Mittellinie (Buchrücken) -->
    <line x1="24" y1="14" x2="24" y2="50" stroke="#1d4ed8" stroke-width="2"/>

    <!-- Diagonale Linien auf der rechten Seite (Seitenstruktur) -->
    <line x1="28" y1="20" x2="40" y2="24" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="28" y1="28" x2="40" y2="32" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="28" y1="36" x2="40" y2="40" stroke="white" stroke-width="1.5" opacity="0.6"/>

    <!-- Digitale Pixel/Balken (SPA-Technologie-Look) -->
    <rect x="46" y="18" width="4" height="8" fill="#3b82f6" rx="1"/>
    <rect x="46" y="28" width="4" height="12" fill="#3b82f6" rx="1"/>
    <rect x="46" y="42" width="4" height="6" fill="#3b82f6" opacity="0.7" rx="1"/>

    <rect x="52" y="22" width="4" height="10" fill="#3b82f6" opacity="0.8" rx="1"/>
    <rect x="52" y="34" width="4" height="14" fill="#3b82f6" rx="1"/>
  </g>
</svg>
